<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Croesus</title>
    <script>
      // Runs before any module/store exists, to set the right class before
      // first paint (avoids a flash of the wrong theme) — see
      // src/stores/theme.ts, which owns this same cookie afterward. Falls
      // back to localStorage for a session that set this before the
      // cookie-based version shipped; the store clears it on next load.
      ;(function () {
        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'))
          return match ? decodeURIComponent(match[1]) : null
        }
        var theme = getCookie('croesus-theme') || localStorage.getItem('croesus-theme')
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
