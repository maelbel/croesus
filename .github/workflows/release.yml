name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A release created with the default GITHUB_TOKEN can't trigger other
          # workflows (GitHub's anti-recursion rule), so publish.yml would never
          # fire on the resulting release. RELEASE_PAT is a fine-grained PAT
          # scoped to just this repo (contents + pull requests, read & write).
          token: ${{ secrets.RELEASE_PAT }}
